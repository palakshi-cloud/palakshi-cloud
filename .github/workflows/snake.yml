name: Generate contribution snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Generate light and dark snakes
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: palakshi-cloud
          outputs: |
            dist/github-snake.svg?color_snake=%232563EB&color_dots=%23E2E8F0,%23BFDBFE,%2360A5FA,%233B82F6,%232563EB
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2360A5FA&color_dots=%231E293B,%231E3A8A,%231D4ED8,%232563EB,%2360A5FA
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish SVGs to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: output
          publish_dir: ./dist
          keep_files: true
          commit_message: "Update contribution snake"
